plugins {
    id 'java'
    id 'war'
}

group = 'cn.edidada'
version = '0.0.1'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    compileOnly 'com.tencent.tars:tars-server:1.6.0'
}

war {
    archiveFileName = 'testtars.war'
}
