name: Bazel CI (macOS / JDK 17)

on:
  push:
    branches: [ "bazel" ]
  pull_request:
    branches: [ "bazel" ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    # setup-bazel caches are OFF by default, so no Actions-cache restore (avoids the 400)
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: false
        disk-cache: false
        repository-cache: false

    - name: Build with Bazel
      run: bazel build //:testtars
